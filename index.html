<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VendorFlow</title>
<meta name="robots" content="noindex">
<!--
  This path used to serve a full copy of the VendorFlow app, built on
  24 August and never updated again. It was 201 commits behind the app
  people actually use, it pointed at the same live Firebase project, and
  it was publicly reachable at https://tbed63.github.io/vendorflow/ --
  so an old bookmark landed a vendor on a three-week-old build of a
  financial app, operating on real data.

  It is a redirect now rather than a deletion of the URL, so any
  bookmark that still exists arrives at the current app instead of a
  404. The stale app.js and styles.css beside it are gone.
-->
<meta http-equiv="refresh" content="0; url=https://app.myvendorflow.com/">
<link rel="canonical" href="https://app.myvendorflow.com/">
<script>location.replace('https://app.myvendorflow.com/');</script>
<style>
  body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;
       background:#F7F9FC;color:#1A346F;padding:24px;text-align:center}
  a{color:#1A346F}
</style>
</head>
<body>
  <p>VendorFlow has moved to <a href="https://app.myvendorflow.com/">app.myvendorflow.com</a>.</p>
</body>
</html>
